name: Real EmDash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: e2e (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, prod]
    env:
      E2E_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4

      # the blog template's pnpm-workspace.yaml uses allowBuilds (pnpm 10.26+)
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:setup
      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.mode }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .real-emdash/site/.astro/dev.log
            .real-emdash/prod/server.log
            test-results/
            playwright-report/
